<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">一次 tools/call 的完整链路</title>
  <desc id="desc">Client 先协商协议版本与能力，再取工具列表；模型生成参数后发起 tools/call，服务端校验执行并把 content、structuredContent、isError 返回给客户端。</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .box { fill: #ddf4ff; stroke: #0969da; }
    .sbox { fill: #f6f8fa; stroke: #d0d7de; }
    .note { fill: #f6f8fa; stroke: #d0d7de; }
    .strip { fill: #f6f8fa; stroke: #d0d7de; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .a { fill: #0969da; }
    .line { stroke: #7d8590; }
    .life { stroke: #8c959f; }
    text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #3d444d; }
      .box { fill: #12263f; stroke: #4493f8; }
      .sbox { fill: #161b22; stroke: #3d444d; }
      .note { fill: #161b22; stroke: #3d444d; }
      .strip { fill: #161b22; stroke: #3d444d; }
      .t { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .a { fill: #4493f8; }
      .line { stroke: #9198a1; }
      .life { stroke: #6e7681; }
    }
  </style>

  <rect class="bg" x="1" y="1" width="958" height="518" rx="18"/>
  <text class="t" x="40" y="46" font-size="22" font-weight="700">一次 tools/call 的完整链路</text>
  <text class="m" x="40" y="72" font-size="13">从握手到结果，五步；大多数「玄学」都能对应到其中一步</text>

  <rect class="box" x="60" y="92" width="220" height="46" rx="10"/>
  <text class="a" x="170" y="121" font-size="15" font-weight="700" text-anchor="middle">Host / Client</text>

  <rect class="sbox" x="600" y="92" width="220" height="46" rx="10"/>
  <text class="t" x="710" y="121" font-size="15" font-weight="700" text-anchor="middle">MCP Server</text>

  <line class="life" x1="170" y1="138" x2="170" y2="440" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line class="life" x1="710" y1="138" x2="710" y2="440" stroke-width="1.5" stroke-dasharray="5 5"/>

  <line class="line" x1="170" y1="172" x2="698" y2="172" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="t" x="440" y="156" font-size="13.5" font-weight="700" text-anchor="middle">1  initialize / server/discover</text>
  <text class="m" x="440" y="192" font-size="11.5" text-anchor="middle">协商协议版本与能力</text>

  <line class="line" x1="170" y1="236" x2="698" y2="236" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="t" x="440" y="220" font-size="13.5" font-weight="700" text-anchor="middle">2  tools/list</text>
  <text class="m" x="440" y="256" font-size="11.5" text-anchor="middle">取回工具名、描述、inputSchema</text>

  <rect class="note" x="60" y="272" width="190" height="58" rx="9" stroke-dasharray="4 4"/>
  <text class="m" x="74" y="294" font-size="11.5">3  模型生成参数</text>
  <text class="t" x="74" y="316" font-size="12.5">{"a": 2, "b": 3}</text>

  <line class="line" x1="170" y1="366" x2="698" y2="366" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="t" x="440" y="350" font-size="13.5" font-weight="700" text-anchor="middle">4  tools/call</text>
  <text class="m" x="440" y="386" font-size="11.5" text-anchor="middle">发 JSON-RPC 请求，带参数</text>

  <line class="line" x1="710" y1="430" x2="182" y2="430" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="t" x="440" y="414" font-size="13.5" font-weight="700" text-anchor="middle">5  result</text>
  <text class="m" x="440" y="450" font-size="11.5" text-anchor="middle">content · structuredContent · isError</text>

  <rect class="strip" x="40" y="470" width="880" height="34" rx="9"/>
  <text class="m" x="480" y="492" font-size="11.5" text-anchor="middle">工具没出现 → 第 2 步 ｜ 参数被拒 → 第 5 步校验 ｜ 返回看不懂 → 第 5 步包装 ｜ 连不上 → 第 1 步</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>
</svg>
