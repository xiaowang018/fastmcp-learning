<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MCP 的三个角色与两种传输</title>
  <desc id="desc">Host 宿主内置 Client 客户端，通过 stdio 子进程或 Streamable HTTP 连接你写的 MCP Server；Server 只声明工具、资源、提示能力。</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .host { fill: #ddf4ff; stroke: #0969da; }
    .client { fill: #ffffff; stroke: #0969da; }
    .server { fill: #f6f8fa; stroke: #d0d7de; }
    .strip { fill: #f6f8fa; stroke: #d0d7de; }
    .chip { fill: #ffffff; stroke: #d0d7de; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .a { fill: #0969da; }
    .line { stroke: #7d8590; }
    .dash { stroke: #8c959f; }
    text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #3d444d; }
      .host { fill: #12263f; stroke: #4493f8; }
      .client { fill: #0d1117; stroke: #4493f8; }
      .server { fill: #161b22; stroke: #3d444d; }
      .strip { fill: #161b22; stroke: #3d444d; }
      .chip { fill: #0d1117; stroke: #3d444d; }
      .t { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .a { fill: #4493f8; }
      .line { stroke: #9198a1; }
      .dash { stroke: #6e7681; }
    }
  </style>

  <rect class="bg" x="1" y="1" width="958" height="418" rx="18"/>

  <text class="t" x="40" y="50" font-size="22" font-weight="700">MCP 的三个角色与两种传输</text>
  <text class="m" x="40" y="76" font-size="13">Host 决定调不调用 · Client 管握手与收发 · Server 只声明能力</text>

  <rect class="host" x="40" y="102" width="300" height="226" rx="14"/>
  <text class="a" x="64" y="136" font-size="17" font-weight="700">Host 宿主</text>
  <text class="t" x="64" y="162" font-size="12.5">Claude Desktop / Cursor</text>
  <text class="t" x="64" y="182" font-size="12.5">Claude Code / 你的 Agent</text>

  <rect class="client" x="64" y="200" width="252" height="104" rx="10" stroke-dasharray="5 4"/>
  <text class="a" x="84" y="228" font-size="15" font-weight="700">Client 客户端</text>
  <text class="m" x="84" y="252" font-size="12">握手 · 收发 · 认证</text>
  <text class="m" x="84" y="274" font-size="12">JSON-RPC 2.0</text>

  <rect class="server" x="620" y="102" width="300" height="226" rx="14"/>
  <text class="t" x="644" y="136" font-size="17" font-weight="700">MCP Server</text>
  <text class="m" x="644" y="160" font-size="12.5">你的 server.py</text>

  <rect class="chip" x="644" y="180" width="82" height="30" rx="15"/>
  <text class="t" x="685" y="200" font-size="12" text-anchor="middle">Tools</text>
  <rect class="chip" x="736" y="180" width="112" height="30" rx="15"/>
  <text class="t" x="792" y="200" font-size="12" text-anchor="middle">Resources</text>
  <rect class="chip" x="644" y="220" width="92" height="30" rx="15"/>
  <text class="t" x="690" y="240" font-size="12" text-anchor="middle">Prompts</text>

  <text class="m" x="644" y="292" font-size="12">只声明能力，不关心谁来调</text>

  <line class="line" x1="340" y1="168" x2="608" y2="168" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="t" x="474" y="152" font-size="14" font-weight="700" text-anchor="middle">stdio</text>
  <text class="m" x="474" y="190" font-size="11.5" text-anchor="middle">子进程 · 按行 JSON-RPC</text>

  <line class="line" x1="340" y1="270" x2="608" y2="270" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="t" x="474" y="254" font-size="14" font-weight="700" text-anchor="middle">HTTP</text>
  <text class="m" x="474" y="292" font-size="11.5" text-anchor="middle">Streamable HTTP · /mcp</text>

  <rect class="strip" x="40" y="352" width="880" height="42" rx="10"/>
  <text class="m" x="480" y="378" font-size="13" text-anchor="middle">Server 只声明能力 ｜ Host 决定调不调用 ｜ Client 负责握手、收发与认证</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>
</svg>
